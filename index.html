<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>100以内数字抽奖系统</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    min-height: 100vh; display: flex; justify-content: center; align-items: center;
    padding: 20px;
}
.container {
    max-width: 700px; width: 100%;
    background: rgba(255,255,255,0.06);
    border-radius: 20px; padding: 40px;
    backdrop-filter: blur(10px);
    box-shadow: 0 25px 60px rgba(0,0,0,0.4);
}
h1 {
    text-align: center; color: #e94560; font-size: 2rem;
    margin-bottom: 8px; letter-spacing: 2px;
}
.subtitle { text-align: center; color: #a0a0b8; margin-bottom: 30px; font-size: 0.95rem; }

/* 当前抽奖结果 */
.result-section {
    background: rgba(233,69,96,0.1); border: 2px dashed #e94560;
    border-radius: 16px; padding: 24px; margin-bottom: 24px;
    min-height: 120px; display: flex; flex-wrap: wrap;
    justify-content: center; align-items: center; gap: 14px;
}
.result-section.placeholder {
    color: #6c6c8a; font-size: 1rem; gap: 0;
}
.ball {
    width: 60px; height: 60px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem; font-weight: 700; color: #fff;
    background: linear-gradient(135deg, #e94560, #c23152);
    box-shadow: 0 6px 20px rgba(233,69,96,0.4);
    animation: popIn 0.4s ease-out;
}
@keyframes popIn {
    0% { transform: scale(0); opacity: 0; }
    70% { transform: scale(1.15); }
    100% { transform: scale(1); opacity: 1; }
}

/* 按钮 */
.btn-group { display: flex; gap: 16px; justify-content: center; margin-bottom: 30px; }
button {
    padding: 14px 40px; border: none; border-radius: 50px;
    font-size: 1.1rem; font-weight: 600; cursor: pointer;
    transition: all 0.3s; letter-spacing: 1px;
}
.btn-draw {
    background: linear-gradient(135deg, #e94560, #c23152);
    color: #fff; box-shadow: 0 6px 20px rgba(233,69,96,0.4);
}
.btn-draw:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(233,69,96,0.55); }
.btn-draw:disabled { background: #555; box-shadow: none; cursor: not-allowed; opacity: 0.6; }
.btn-reset {
    background: transparent; color: #a0a0b8;
    border: 2px solid #444;
}
.btn-reset:hover { border-color: #888; color: #fff; }

/* 历史记录 */
.history-title { color: #ccc; font-size: 1.1rem; margin-bottom: 14px; }
.history-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
.history-item {
    display: flex; align-items: center; gap: 16px;
    background: rgba(255,255,255,0.04); border-radius: 12px;
    padding: 14px 18px; border-left: 4px solid #e94560;
}
.history-label { color: #888; font-size: 0.9rem; white-space: nowrap; font-weight: 600; }
.history-balls { display: flex; gap: 8px; flex-wrap: wrap; }
.history-ball {
    width: 38px; height: 38px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.9rem; font-weight: 700; color: #fff;
    background: linear-gradient(135deg, #533483, #3b2e5e);
    box-shadow: 0 3px 10px rgba(83,52,131,0.3);
}
.remaining { text-align: center; color: #888; margin-top: 6px; font-size: 0.9rem; }
.remaining span { color: #e94560; font-weight: 700; }
</style>
</head>
<body>
<div class="container">
    <h1>抽奖系统</h1>
    <p class="subtitle">数字范围 1-100 | 每次抽取 7 个 | 最多 5 次</p>

    <div class="result-section placeholder" id="resultArea">点击下方按钮开始抽奖</div>

    <div class="btn-group">
        <button class="btn-draw" id="btnDraw" onclick="draw()">开始抽奖</button>
        <button class="btn-reset" onclick="reset()">重置</button>
    </div>

    <p class="remaining">剩余抽取次数：<span id="remainCount">5</span></p>

    <h3 class="history-title">历史记录</h3>
    <ul class="history-list" id="historyList">
        <li style="color:#555;text-align:center;padding:20px;">暂无记录</li>
    </ul>
</div>

<script>
const TOTAL = 100;   // 数字范围 1-100
const PER_DRAW = 7;  // 每次抽7个
const MAX_DRAWS = 5; // 最多5次

let drawCount = 0;
let history = [];

// Fisher-Yates 洗牌后取前 N 个
function pickNumbers(n) {
    const arr = Array.from({ length: TOTAL }, (_, i) => i + 1);
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr.slice(0, n).sort((a, b) => a - b);
}

function draw() {
    if (drawCount >= MAX_DRAWS) return;
    const numbers = pickNumbers(PER_DRAW);
    drawCount++;
    history.push(numbers);

    renderResult(numbers);
    renderHistory();
    updateUI();
}

function renderResult(numbers) {
    const area = document.getElementById('resultArea');
    area.classList.remove('placeholder');
    area.innerHTML = numbers.map((n, i) =>
        `<div class="ball" style="animation-delay:${i * 0.06}s">${n}</div>`
    ).join('');
}

function renderHistory() {
    const list = document.getElementById('historyList');
    if (history.length === 0) {
        list.innerHTML = '<li style="color:#555;text-align:center;padding:20px;">暂无记录</li>';
        return;
    }
    list.innerHTML = history.map((nums, idx) => `
        <li class="history-item">
            <span class="history-label">第 ${idx + 1} 次</span>
            <div class="history-balls">
                ${nums.map(n => `<span class="history-ball">${n}</span>`).join('')}
            </div>
        </li>
    `).reverse().join('');
}

function updateUI() {
    document.getElementById('remainCount').textContent = MAX_DRAWS - drawCount;
    const btn = document.getElementById('btnDraw');
    if (drawCount >= MAX_DRAWS) {
        btn.disabled = true;
        btn.textContent = '抽取完毕';
    }
}

function reset() {
    drawCount = 0;
    history = [];
    const area = document.getElementById('resultArea');
    area.classList.add('placeholder');
    area.innerHTML = '点击下方按钮开始抽奖';
    renderHistory();
    updateUI();
    document.getElementById('btnDraw').textContent = '开始抽奖';
}
</script>
</body>
</html>
